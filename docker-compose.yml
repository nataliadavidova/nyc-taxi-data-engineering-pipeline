services:
  postgres:
    image: postgres:13
    container_name: nyc_taxi_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U airflow -d airflow" ]
      interval: 5s
      timeout: 5s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:25.8.24.21
    container_name: nyc_taxi_final_project-clickhouse-1
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse

  airflow-init:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    container_name: nyc_taxi_airflow_init
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_started
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PYTHONPATH: /opt/airflow/jobs
    volumes:
      - ./dags:/opt/airflow/dags
      - ./jobs:/opt/airflow/jobs
      - ./logs:/opt/airflow/logs
      - ./data:/opt/airflow/data

    command:
      - bash
      - -c
      - |
        set -e

        airflow db migrate

        airflow users create \
          --username "$${AIRFLOW_ADMIN_USERNAME}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          --password "$${AIRFLOW_ADMIN_PASSWORD}" \
        || airflow users reset-password \
          -u "$${AIRFLOW_ADMIN_USERNAME}" \
          -p "$${AIRFLOW_ADMIN_PASSWORD}"

  airflow:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    container_name: nyc_taxi_airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PYTHONPATH: /opt/airflow/jobs
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./jobs:/opt/airflow/jobs
      - ./logs:/opt/airflow/logs
      - ./data:/opt/airflow/data
      - ./tests:/opt/airflow/tests
      - ./sql:/opt/airflow/sql
      - ./docs:/opt/airflow/docs
      - /var/run/docker.sock:/var/run/docker.sock
    command: >
      bash -c "
      airflow scheduler &
      airflow webserver --port 8080
      "
  dbt:
    image: nyc_taxi_dbt:latest
    build:
      context: .
      dockerfile: docker/dbt/Dockerfile
    profiles:
      - tools
    depends_on:
      - clickhouse
    env_file:
      - .env
    volumes:
      - ./dbt:/usr/app/dbt

  superset:
    image: apache/superset:latest
    container_name: superset
    depends_on:
      - clickhouse
    user: root
    env_file:
      - .env
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
    ports:
      - "8088:8088"
    volumes:
      - ./superset:/app/superset_home
      - ./superset/requirements-local.txt:/app/requirements-local.txt
    command:
      - /bin/bash
      - -c
      - |
        set -e

        uv pip install \
          -r /app/requirements-local.txt \
          --python /app/.venv/bin/python \
          --link-mode=copy

        superset db upgrade

        superset fab create-admin \
          --username "$${SUPERSET_ADMIN_USERNAME}" \
          --firstname Admin \
          --lastname User \
          --email admin@example.com \
          --password "$${SUPERSET_ADMIN_PASSWORD}" || true

        superset init

        exec superset run \
          -h 0.0.0.0 \
          -p 8088

volumes:
  postgres_data:
  clickhouse_data:


networks:
  default:
    name: nyc_taxi_network
